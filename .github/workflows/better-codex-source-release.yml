name: Better Codex source release

on:
  push:
    tags:
      - "v*.*.*-better-codex*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate downstream tag and source package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-better-codex(\.[0-9]+)?$ ]]
          base="${tag#v}"
          base="${base%%-better-codex*}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' codex-rs/Cargo.toml | head -1)"
          [[ "${base}" == "${cargo_version}" ]]
          grep -q '^name = "better-codex"$' codex-rs/cli/Cargo.toml
          grep -q 'pub const VERSION: &str = concat!(env!("CARGO_PKG_VERSION"), "-better-codex");' \
            codex-rs/product-info/src/lib.rs

      - name: Create source-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "Better Codex ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
